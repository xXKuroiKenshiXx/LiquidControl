name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Formato, lint y pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  release:
    name: Ejecutable de la versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p liquidcontrol
      - name: Preparar paquete portable
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $package = "LiquidControl-$version-portable"
          New-Item -ItemType Directory -Path "dist/$package" -Force | Out-Null
          Copy-Item target/release/liquidcontrol.exe "dist/$package/"
          New-Item -ItemType File -Path "dist/$package/portable.txt" -Force | Out-Null
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md "dist/$package/"
          Compress-Archive -Path "dist/$package/*" -DestinationPath "dist/$package.zip"
          (Get-FileHash "dist/$package.zip" -Algorithm SHA256).Hash |
            Set-Content "dist/$package.zip.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
